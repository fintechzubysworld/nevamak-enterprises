<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>NEVAMAK – Reports & Analytics</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', -apple-system, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 12px; }
        .container { max-width: 1300px; margin: auto; }
        header { background: #0a3d62; color: white; padding: 12px 16px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        header h1 { margin: 0; font-size: 1.4rem; }
        .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav-links a, .logout-btn { background: #3c6382; color: white; text-decoration: none; padding: 6px 14px; border-radius: 40px; font-size: 0.85rem; border: none; cursor: pointer; }
        .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
        .tab-btn { background: #ccc; color: #333; padding: 8px 16px; border-radius: 40px; border: none; cursor: pointer; font-weight: 500; }
        .tab-btn.active { background: #0a3d62; color: white; }
        .tab-content { display: none; background: white; border-radius: 24px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .tab-content.active { display: block; }
        .filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .filters input, .filters select { padding: 8px 16px; border-radius: 40px; border: 1px solid #ccc; }
        .filters button { padding: 8px 20px; border-radius: 40px; border: none; background: #0a3d62; color: white; cursor: pointer; }
        .filters button.export { background: #27ae60; }
        .filters button.clear { background: #e74c3c; }
        .filters .search-input { flex: 1; min-width: 180px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #ddd; text-align: left; font-size: 0.9rem; }
        th { background: #f8f9fa; font-weight: 600; }
        .badge { background: #e2e3e5; padding: 2px 10px; border-radius: 20px; font-size: 0.7rem; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
        .status-dispatched { background: #ffeaa7; color: #b85c00; }
        .status-delivered { background: #d4edda; color: #155724; }
        .status-partial { background: #fff3cd; color: #856404; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .scroll { overflow-x: auto; }
        .empty { text-align: center; color: #888; padding: 20px; }
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 24px; border-radius: 24px; max-width: 900px; width: 95%; max-height: 90vh; overflow-y: auto; }
        .close { float: right; cursor: pointer; font-size: 1.8rem; }
        .invoice-box { border: 1px solid #ddd; padding: 16px; background: white; border-radius: 16px; }
        .invoice-box table { width: 100%; border-collapse: collapse; }
        .invoice-box th, .invoice-box td { border: 1px solid #ddd; padding: 8px; }
        .btn-sm { padding: 4px 12px; border-radius: 40px; border: none; cursor: pointer; font-size: 0.8rem; }
        .btn-success { background: #27ae60; color: white; }
        .btn-primary { background: #0a3d62; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-info { background: #3498db; color: white; }
        .permission-error { background: #f8d7da; border-left: 4px solid #e74c3c; padding: 16px; border-radius: 12px; margin: 12px 0; }
        .permission-error a { color: #0a3d62; font-weight: 600; }
        .permission-error .index-link { word-break: break-all; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #0a3d62; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 500; font-size: 0.85rem; margin-bottom: 3px; color: #2a4058; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 14px; border-radius: 30px; border: 1px solid #d8e0ea; font-size: 0.9rem; }
        .item-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; align-items: center; background: #f8faff; padding: 6px 10px; border-radius: 14px; border-left: 3px solid #0a3d62; }
        .item-row input { flex: 1; min-width: 60px; padding: 6px 10px; border-radius: 30px; border: 1px solid #d8e0ea; font-size: 0.82rem; }
        .item-row .remove-btn { background: #e74c3c; color: #fff; border: none; border-radius: 40px; padding: 4px 12px; font-size: 0.75rem; cursor: pointer; }
        .cost-summary { background: #eaf1fa; padding: 10px 16px; border-radius: 40px; font-weight: 600; text-align: center; margin: 12px 0; }
        .modal-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
        .modal-actions .btn { padding: 10px 28px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; font-size: 0.88rem; transition: 0.15s; }
        .modal-actions .btn-success { background: #27ae60; color: white; }
        .modal-actions .btn-danger { background: #e74c3c; color: white; }
        .modal-actions .btn-outline { background: transparent; border: 1px solid #d0d8e2; }
        @media (max-width: 600px) { .filters { flex-direction: column; align-items: stretch; } .filters input, .filters select { width: 100%; } .filters .search-input { width: 100%; } }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>📊 Reports & Analytics</h1>
        <div class="nav-links">
            <a href="index.html">🏠 Dashboard</a>
            <a href="invoice_repo.html">🧾 Invoice Repo</a>
            <a href="permissions.html">🔐 Permissions</a>
            <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
        </div>
    </header>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="invoices">🧾 Invoices</button>
        <button class="tab-btn" data-tab="returns">🔄 Returns</button>
        <button class="tab-btn" data-tab="dispatched">📦 Dispatched</button>
        <button class="tab-btn" data-tab="received">📥 Received</button>
    </div>

    <!-- Invoices Tab -->
    <div id="tab-invoices" class="tab-content active">
        <div class="filters">
            <input type="text" id="invSearch" class="search-input" placeholder="🔍 Search by item, GRN, supplier...">
            <input type="date" id="invDateStart">
            <input type="date" id="invDateEnd">
            <select id="invBranch"><option value="">All Branches</option><option value="Abuja">Abuja</option><option value="Portharcourt">Port Harcourt</option></select>
            <button id="invFilterBtn">Filter</button>
            <button id="invClearBtn" class="clear">✖ Clear</button>
            <button class="export" onclick="exportCSV('invTable')">📄 Export CSV</button>
        </div>
        <div class="scroll" id="invoiceList">Loading...</div>
    </div>

    <!-- Returns Tab -->
    <div id="tab-returns" class="tab-content">
        <div class="filters">
            <input type="text" id="retSearch" class="search-input" placeholder="🔍 Search by item, shipment ID...">
            <input type="date" id="retDateStart">
            <input type="date" id="retDateEnd">
            <select id="retBranch"><option value="">All Branches</option><option value="Abuja">Abuja</option><option value="Portharcourt">Port Harcourt</option></select>
            <button id="retFilterBtn">Filter</button>
            <button id="retClearBtn" class="clear">✖ Clear</button>
            <button class="export" onclick="exportCSV('retTable')">📄 Export CSV</button>
        </div>
        <div class="scroll" id="returnsList">Loading...</div>
    </div>

    <!-- Dispatched Tab -->
    <div id="tab-dispatched" class="tab-content">
        <div class="filters">
            <input type="text" id="dispSearch" class="search-input" placeholder="🔍 Search by item, sender, destination...">
            <input type="date" id="dispDateStart">
            <input type="date" id="dispDateEnd">
            <select id="dispStatus"><option value="">All Status</option><option value="Dispatched">Dispatched</option><option value="Delivered">Delivered</option><option value="Partially Delivered">Partial</option><option value="Rejected">Rejected</option></select>
            <button id="dispFilterBtn">Filter</button>
            <button id="dispClearBtn" class="clear">✖ Clear</button>
            <button class="export" onclick="exportCSV('dispTable')">📄 Export CSV</button>
        </div>
        <div class="scroll" id="dispatchedList">Loading...</div>
    </div>

    <!-- Received Tab -->
    <div id="tab-received" class="tab-content">
        <div class="filters">
            <input type="text" id="recvSearch" class="search-input" placeholder="🔍 Search by item, GRN, supplier...">
            <input type="date" id="recvDateStart">
            <input type="date" id="recvDateEnd">
            <select id="recvBranch"><option value="">All Branches</option><option value="Abuja">Abuja</option><option value="Portharcourt">Port Harcourt</option></select>
            <button id="recvFilterBtn">Filter</button>
            <button id="recvClearBtn" class="clear">✖ Clear</button>
            <button class="export" onclick="exportCSV('recvTable')">📄 Export CSV</button>
        </div>
        <div class="scroll" id="receivedList">Loading...</div>
    </div>

    <!-- Invoice Modal (for preview and save to repository) -->
    <div id="invoiceModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('invoiceModal')">&times;</span>
            <div id="invoiceContent"></div>
            <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:16px;">
                <button id="printInvoiceBtn" onclick="window.print()" style="background:#0a3d62; color:white; border:none; padding:10px 20px; border-radius:40px; cursor:pointer;">🖨️ Print</button>
                <button id="downloadInvoiceBtn" style="background:#27ae60; color:white; border:none; padding:10px 20px; border-radius:40px; cursor:pointer;">📥 Download PDF</button>
                <button id="saveToRepositoryBtn" style="background:#8e44ad; color:white; border:none; padding:10px 20px; border-radius:40px; cursor:pointer;">💾 Save to Invoice Repository</button>
            </div>
            <div id="saveMessage" style="color:green; margin-top:8px; text-align:center;"></div>
        </div>
    </div>

    <!-- Generate Invoice Modal (editable) -->
    <div id="generateInvoiceModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('generateInvoiceModal')">&times;</span>
            <h2>🧾 Generate Invoice from Received Goods</h2>
            <form id="generateInvoiceForm">
                <input type="hidden" id="genShipmentId">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="form-group"><label>Invoice #</label><input type="text" id="genInvoiceNumber" readonly></div>
                    <div class="form-group"><label>Date</label><input type="date" id="genInvoiceDate"></div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="form-group"><label>Customer</label><input type="text" id="genCustomer" required></div>
                    <div class="form-group"><label>Branch</label>
                        <select id="genBranch"><option value="Lagos">Lagos</option><option value="Abuja">Abuja</option><option value="Portharcourt">Port Harcourt</option></select>
                    </div>
                </div>
                <div class="form-group"><label>Notes</label><textarea id="genNotes" rows="2"></textarea></div>
                <div class="form-group">
                    <label>Items</label>
                    <div id="genItemsContainer"></div>
                    <button type="button" class="btn-sm btn-primary" id="addGenItemBtn">＋ Add Item</button>
                </div>
                <div class="cost-summary" id="genTotalPreview">Total: ₦0</div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-success">💾 Save Invoice</button>
                    <button type="button" class="btn btn-outline" onclick="closeModal('generateInvoiceModal')">Cancel</button>
                </div>
                <div id="genMessage" style="color:#c0392b; margin-top:8px;"></div>
            </form>
        </div>
    </div>

</div>

<script>
    // ==================== Firebase Config ====================
    const firebaseConfig = {
        apiKey: "AIzaSyBL_OZw3GmNHWjwBdGCc4F-5nUXEy5ZIcI",
        authDomain: "nevamak-enterprises.firebaseapp.com",
        projectId: "nevamak-enterprises",
        storageBucket: "nevamak-enterprises.firebasestorage.app",
        messagingSenderId: "144324172534",
        appId: "1:144324172534:web:4b6dd31754c79fd830aad7",
        measurementId: "G-MZ8NT6KK8N"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentRole = '';
    let currentShipmentId = null;
    let genItemCounter = 0;

    // ==================== Auth ====================
    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        currentUser = user;
        const userDoc = await db.collection('users').doc(user.uid).get();
        currentRole = userDoc.data()?.role || '';
        if (currentRole === 'vendor' || currentRole === 'external_vendor') {
            alert('Access denied. Vendors cannot view reports.');
            window.location.href = 'external_vendor.html';
            return;
        }
        loadInvoices();
        loadReturns();
        loadDispatched();
        loadReceived();
        setupSearchListeners();
        setupClearButtons();
        setupGenerateInvoiceForm();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut().then(() => window.location.href = 'login.html'));

    // ==================== Tab Switching ====================
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
        });
    });

    // ==================== Utility: Export CSV ====================
    function exportCSV(tableId) {
        const table = document.getElementById(tableId);
        if (!table) return alert('No data to export.');
        let csv = '';
        const rows = table.querySelectorAll('tr');
        rows.forEach(row => {
            const cols = row.querySelectorAll('td, th');
            const rowData = [];
            cols.forEach(col => rowData.push('"' + col.innerText.replace(/"/g, '""') + '"'));
            csv += rowData.join(',') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${tableId}_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
    }

    // ==================== Build Role-Based Query ====================
    function addRoleFilter(q, branchField = 'destinationBranch') {
        if (currentRole === 'admin' || currentRole === 'lagos_sender') {
            return q;
        } else if (currentRole === 'abuja_rep') {
            return q.where(branchField, '==', 'Abuja');
        } else if (currentRole === 'ph_rep') {
            return q.where(branchField, '==', 'Portharcourt');
        } else {
            return q.limit(0);
        }
    }

    // ==================== Setup Search Listeners ====================
    function setupSearchListeners() {
        document.getElementById('invSearch').addEventListener('input', function() {
            filterTable('invTable', this.value);
        });
        document.getElementById('retSearch').addEventListener('input', function() {
            filterTable('retTable', this.value);
        });
        document.getElementById('dispSearch').addEventListener('input', function() {
            filterTable('dispTable', this.value);
        });
        document.getElementById('recvSearch').addEventListener('input', function() {
            filterTable('recvTable', this.value);
        });
    }

    function filterTable(tableId, searchText) {
        const table = document.getElementById(tableId);
        if (!table) return;
        const rows = table.querySelectorAll('tbody tr');
        const search = searchText.toLowerCase().trim();
        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(search) ? '' : 'none';
        });
    }

    // ==================== Setup Clear Buttons ====================
    function setupClearButtons() {
        document.getElementById('invClearBtn').addEventListener('click', function() {
            document.getElementById('invSearch').value = '';
            document.getElementById('invDateStart').value = '';
            document.getElementById('invDateEnd').value = '';
            document.getElementById('invBranch').value = '';
            loadInvoices();
        });
        document.getElementById('retClearBtn').addEventListener('click', function() {
            document.getElementById('retSearch').value = '';
            document.getElementById('retDateStart').value = '';
            document.getElementById('retDateEnd').value = '';
            document.getElementById('retBranch').value = '';
            loadReturns();
        });
        document.getElementById('dispClearBtn').addEventListener('click', function() {
            document.getElementById('dispSearch').value = '';
            document.getElementById('dispDateStart').value = '';
            document.getElementById('dispDateEnd').value = '';
            document.getElementById('dispStatus').value = '';
            loadDispatched();
        });
        document.getElementById('recvClearBtn').addEventListener('click', function() {
            document.getElementById('recvSearch').value = '';
            document.getElementById('recvDateStart').value = '';
            document.getElementById('recvDateEnd').value = '';
            document.getElementById('recvBranch').value = '';
            loadReceived();
        });
    }

    // ==================== Invoices ====================
    async function loadInvoices() {
        const container = document.getElementById('invoiceList');
        container.innerHTML = '<div style="text-align:center; padding:20px;"><div class="loading-spinner"></div> Loading...</div>';
        try {
            const start = document.getElementById('invDateStart').value;
            const end = document.getElementById('invDateEnd').value;
            const branch = document.getElementById('invBranch').value;
            let q = db.collection('shipments')
                        .where('status', '==', 'Delivered')
                        .where('grnNumber', '!=', null);
            q = addRoleFilter(q);
            if (start) q = q.where('receivedDate', '>=', new Date(start));
            if (end) {
                const endDate = new Date(end);
                endDate.setHours(23,59,59);
                q = q.where('receivedDate', '<=', endDate);
            }
            if (branch && (currentRole === 'admin' || currentRole === 'lagos_sender')) {
                q = q.where('destinationBranch', '==', branch);
            }
            const snap = await q.get();
            if (snap.empty) {
                container.innerHTML = '<p class="empty">No invoices found. Try adjusting filters.</p>';
                return;
            }
            let html = '<table id="invTable"><thead><tr><th>GRN</th><th>Date</th><th>Branch</th><th>Supplier</th><th>Items</th><th>Total Goods</th><th>Transport</th><th>Action</th></tr></thead><tbody>';
            snap.forEach(doc => {
                const d = doc.data();
                const totalGoods = d.items ? d.items.reduce((s,i) => s + (i.totalItemCost||0), 0) : 0;
                const itemsShort = d.items ? d.items.map(i => i.itemName).join(", ").substring(0,60) : '-';
                html += `<tr>
                    <td>${d.grnNumber || 'N/A'}</td>
                    <td>${d.receivedDate ? new Date(d.receivedDate.toDate()).toLocaleDateString() : ''}</td>
                    <td>${d.destinationBranch}</td>
                    <td>${d.senderName}</td>
                    <td>${itemsShort}</td>
                    <td>₦${totalGoods.toLocaleString()}</td>
                    <td>₦${(d.transportCost||0).toLocaleString()}</td>
                    <td><button onclick="viewInvoice('${doc.id}')" style="background:#f39c12; border:none; color:white; padding:4px 16px; border-radius:40px; cursor:pointer;">Preview</button></td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
            const searchVal = document.getElementById('invSearch').value.trim();
            if (searchVal) filterTable('invTable', searchVal);
        } catch (error) {
            console.error('Invoices load error:', error);
            let errorHtml = `<div class="permission-error"><strong>⚠️ Error loading invoices:</strong> ${error.message}</div>`;
            container.innerHTML = errorHtml;
        }
    }

    window.viewInvoice = async (shipId) => {
        try {
            const doc = await db.collection('shipments').doc(shipId).get();
            if (!doc.exists) return;
            currentShipmentId = shipId;
            const d = doc.data();
            const items = d.items || [];
            let itemsHtml = '';
            items.forEach(it => {
                itemsHtml += `<tr><td>${it.itemName}</td><td>${it.orderedQty}</td><td>₦${it.unitPrice?.toLocaleString()}</td><td>₦${(it.totalItemCost||0).toLocaleString()}</td></tr>`;
            });
            const totalGoods = items.reduce((s,i) => s + (i.totalItemCost||0), 0);
            const html = `
                <div id="invoiceContentInner">
                    <h2>NEVAMAK Enterprises</h2>
                    <h3>Goods Received Note (GRN)</h3>
                    <p><strong>GRN:</strong> ${d.grnNumber || 'N/A'}</p>
                    <p><strong>Date:</strong> ${d.receivedDate ? new Date(d.receivedDate.toDate()).toLocaleString() : 'N/A'}</p>
                    <p><strong>Supplier:</strong> ${d.senderName}</p>
                    <p><strong>Branch:</strong> ${d.destinationBranch}</p>
                    <p><strong>Vehicle:</strong> ${d.vehicleNo || 'N/A'}</p>
                    <p><strong>Transport Cost:</strong> ₦${(d.transportCost||0).toLocaleString()}</p>
                    <table border="1" cellpadding="5" style="width:100%; border-collapse:collapse;">
                        <tr><th>Item</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr>
                        ${itemsHtml}
                        <tr><td colspan="3"><strong>Total Goods</strong></td><td><strong>₦${totalGoods.toLocaleString()}</strong></td></tr>
                    </table>
                    <p><em>Received by: ${d.receivingRep}</em></p>
                    <p>This is a system-generated invoice.</p>
                </div>
            `;
            document.getElementById('invoiceContent').innerHTML = html;
            document.getElementById('saveMessage').innerText = '';
            document.getElementById('invoiceModal').style.display = 'flex';
        } catch (error) {
            alert('Error loading invoice: ' + error.message);
        }
    };

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    };

    document.getElementById('saveToRepositoryBtn').addEventListener('click', async () => {
        if (!currentShipmentId) {
            alert('No invoice loaded.');
            return;
        }
        try {
            const doc = await db.collection('shipments').doc(currentShipmentId).get();
            if (!doc.exists) return alert('Shipment not found.');
            const d = doc.data();
            const items = (d.items || []).map(it => ({
                itemName: it.itemName,
                quantity: it.orderedQty || 0,
                unitPrice: it.unitPrice || 0,
                total: (it.orderedQty || 0) * (it.unitPrice || 0)
            }));
            const total = items.reduce((sum, i) => sum + i.total, 0);
            const invoiceData = {
                invoiceNumber: d.grnNumber || 'INV-' + Date.now().toString(36).toUpperCase(),
                date: d.receivedDate ? new Date(d.receivedDate.toDate()).toISOString().slice(0,10) : new Date().toISOString().slice(0,10),
                customer: d.senderName || 'N/A',
                customerEmail: '',
                notes: `Generated from GRN ${d.grnNumber}`,
                items: items,
                total: total,
                createdBy: currentUser.email,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.collection('invoices').add(invoiceData);
            document.getElementById('saveMessage').innerText = '✅ Invoice saved to repository!';
            setTimeout(() => { document.getElementById('saveMessage').innerText = ''; }, 5000);
        } catch (error) {
            alert('Error saving to repository: ' + error.message);
        }
    });

    document.getElementById('downloadInvoiceBtn').addEventListener('click', async () => {
        const element = document.getElementById('invoiceContentInner');
        if (!element) return alert('No invoice to download.');
        try {
            const canvas = await html2canvas(element, { scale: 2 });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgWidth = 190;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
            pdf.save(`Invoice_${new Date().toISOString().slice(0,10)}.pdf`);
        } catch (error) {
            alert('Error generating PDF: ' + error.message);
        }
    });

    // ==================== Returns ====================
    async function loadReturns() {
        const container = document.getElementById('returnsList');
        container.innerHTML = '<div style="text-align:center; padding:20px;"><div class="loading-spinner"></div> Loading...</div>';
        try {
            const start = document.getElementById('retDateStart').value;
            const end = document.getElementById('retDateEnd').value;
            const branch = document.getElementById('retBranch').value;
            let q = db.collection('returns');
            q = addRoleFilter(q, 'branch');
            if (start) q = q.where('date', '>=', new Date(start));
            if (end) {
                const endDate = new Date(end);
                endDate.setHours(23,59,59);
                q = q.where('date', '<=', endDate);
            }
            if (branch && (currentRole === 'admin' || currentRole === 'lagos_sender')) {
                q = q.where('branch', '==', branch);
            }
            const snap = await q.get();
            let docs = [];
            snap.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
            docs.sort((a, b) => (b.date?.toDate() || 0) - (a.date?.toDate() || 0));
            if (docs.length === 0) {
                container.innerHTML = '<p class="empty">No returns found.</p>';
                return;
            }
            let html = '<table id="retTable"><thead><tr><th>Date</th><th>Branch</th><th>Shipment</th><th>Item</th><th>Qty</th><th>Reason</th><th>By</th></tr></thead><tbody>';
            docs.forEach(r => {
                html += `<tr>
                    <td>${r.date ? new Date(r.date.toDate()).toLocaleDateString() : ''}</td>
                    <td>${r.branch}</td>
                    <td>${r.shipmentId?.slice(0,8) || ''}</td>
                    <td>${r.itemName}</td>
                    <td>${r.returnedQty}</td>
                    <td>${r.reason || '-'}</td>
                    <td>${r.createdBy || '-'}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
            const searchVal = document.getElementById('retSearch').value.trim();
            if (searchVal) filterTable('retTable', searchVal);
        } catch (error) {
            console.error('Returns load error:', error);
            let errorHtml = `<div class="permission-error"><strong>⚠️ Error loading returns:</strong> ${error.message}</div>`;
            container.innerHTML = errorHtml;
        }
    }

    // ==================== Dispatched ====================

        container.innerHTML = '<div style="text-align:center; padding:20px;"><div class="loading-spinner"></div> Loading...</div>';
        try {
            const start = document.getElementById('dispDateStart').value;
            const end = document.getElementById('dispDateEnd').value;

            let q = db.collection('shipments');
            q = addRoleFilter(q);
            if (start) q = q.where('createdAt', '>=', new Date(start));
            if (end) {
                const endDate = new Date(end);
                endDate.setHours(23,59,59);
                q = q.where('createdAt', '<=', endDate);
            }
            if (status) q = q.where('status', '==', status);
            const snap = await q.get();
            let docs = [];
            snap.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
            docs.sort((a, b) => (b.createdAt?.toDate() || 0) - (a.createdAt?.toDate() || 0));
            if (docs.length === 0) {
                container.innerHTML = '<p class="empty">No dispatched shipments found.</p>';

            docs.forEach(d => {
                const itemsShort = d.items ? d.items.map(i => `${i.itemName}(${i.orderedQty})`).join(", ").substring(0,60) : '-';

                    <td>${d.senderName}</td>

        } catch (error) {
            console.error('Dispatched load error:', error);
            let errorHtml = `<div class="permission-error"><strong>⚠️ Error loading dispatched:</strong> ${error.message}</div>`;

                    <td>${d.senderName}</td>
                    <td>${itemsShort}</td>
                    <td>₦${totalGoods.toLocaleString()}</td>
                    <td>${d.receivingRep || '-'}</td>
                    <td><button onclick="openGenerateInvoice('${doc.id}')" style="background:#27ae60; color:white; border:none; padding:4px 16px; border-radius:40px; cursor:pointer;">📄 Generate Invoice</button></td>

    // ==================== Generate Invoice from Received ====================

    function setupGenerateInvoiceForm() {
        document.getElementById('addGenItemBtn').addEventListener('click', () => addGenItemRow());
        document.getElementById('generateInvoiceForm').addEventListener('submit', saveGeneratedInvoice);
    }

    function addGenItemRow(name = '', qty = 1, price = 0) {
        const id = ++genItemCounter;
        const container = document.getElementById('genItemsContainer');
        const div = document.createElement('div');
        div.className = 'item-row';
        div.dataset.rowId = id;
        div.innerHTML = `
            <input type="text" placeholder="Item name" class="gen-item-name" value="${escapeHtml(name)}" style="flex:2;" required>
            <input type="number" placeholder="Qty" class="gen-item-qty" value="${Math.max(0,qty)}" min="0" step="1" style="flex:0.8;">
            <input type="number" placeholder="Unit Price" class="gen-item-price" value="${Math.max(0,price)}" min="0" step="0.01" style="flex:1;">
            <button type="button" class="remove-btn" onclick="removeGenItem(this)">✖</button>
        `;
        container.appendChild(div);
        div.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateGenTotal));
        updateGenTotal();
    }

    window.removeGenItem = function(btn) {
        const container = document.getElementById('genItemsContainer');
        if (container.children.length <= 1) { alert('Cannot remove the last item.'); return; }
        btn.closest('.item-row').remove();
        updateGenTotal();
    };

    function updateGenTotal() {
        const rows = document.querySelectorAll('#genItemsContainer .item-row');
        let total = 0;
        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.gen-item-qty').value) || 0;
            const price = parseFloat(row.querySelector('.gen-item-price').value) || 0;
            total += qty * price;
        });
        document.getElementById('genTotalPreview').textContent = `Total: ₦${total.toLocaleString()}`;
    }

    window.openGenerateInvoice = async function(shipmentId) {
        try {
            const doc = await db.collection('shipments').doc(shipmentId).get();
            if (!doc.exists) { alert('Shipment not found.'); return; }
            const d = doc.data();

            // Pre-fill form
            document.getElementById('genShipmentId').value = shipmentId;
            document.getElementById('genInvoiceNumber').value = 'INV-' + Date.now().toString(36).toUpperCase();
            document.getElementById('genInvoiceDate').value = new Date().toISOString().slice(0,10);
            document.getElementById('genCustomer').value = d.senderName || '';
            document.getElementById('genBranch').value = d.destinationBranch || 'Lagos';
            document.getElementById('genNotes').value = `Generated from GRN ${d.grnNumber || 'N/A'}`;

            // Items
            const container = document.getElementById('genItemsContainer');
            container.innerHTML = '';
            genItemCounter = 0;
            const items = d.items || [];
            if (items.length === 0) {
                addGenItemRow('', 1, 0);
            } else {
                items.forEach(it => {
                    const qty = it.orderedQty || 0;
                    const price = it.unitPrice || 0;
                    if (qty > 0 && price > 0) {
                        addGenItemRow(it.itemName, qty, price);
                    }
                });
                if (container.children.length === 0) addGenItemRow('', 1, 0);
            }
            updateGenTotal();
            document.getElementById('genMessage').textContent = '';
            document.getElementById('generateInvoiceModal').style.display = 'flex';
        } catch (error) {
            alert('Error loading shipment: ' + error.message);
        }
    };

    async function saveGeneratedInvoice(e) {
        e.preventDefault();
        const btn = e.target.querySelector('.btn-success');
        btn.disabled = true;
        btn.textContent = 'Saving…';
        document.getElementById('genMessage').textContent = '';

        try {
            const invNum = document.getElementById('genInvoiceNumber').value;
            const date = document.getElementById('genInvoiceDate').value;
            const customer = document.getElementById('genCustomer').value.trim();
            if (!customer) throw new Error('Customer is required.');
            const branch = document.getElementById('genBranch').value;
            const notes = document.getElementById('genNotes').value.trim();

            // Collect items
            const rows = document.querySelectorAll('#genItemsContainer .item-row');
            const items = [];
            rows.forEach(row => {
                const name = row.querySelector('.gen-item-name').value.trim();
                const qty = parseFloat(row.querySelector('.gen-item-qty').value) || 0;
                const price = parseFloat(row.querySelector('.gen-item-price').value) || 0;
                if (name && qty > 0 && price > 0) {
                    items.push({ itemName: name, quantity: qty, unitPrice: price, total: qty * price });
                }
            });
            if (items.length === 0) throw new Error('Add at least one valid item.');

            const total = items.reduce((sum, i) => sum + i.total, 0);

            // Check duplicate invoice number
            const existing = await db.collection('invoices').where('invoiceNumber', '==', invNum).get();
            if (!existing.empty) {
                const newNum = 'INV-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).substring(2,6).toUpperCase();
                document.getElementById('genInvoiceNumber').value = newNum;
                throw new Error(`Invoice # already exists. Auto-generated: ${newNum}`);
            }

            // Save to invoices collection
            await db.collection('invoices').add({
                invoiceNumber: invNum,
                date: date,
                customer: customer,
                customerEmail: '',
                notes: notes,
                branch: branch,
                items: items,
                total: total,
                createdBy: currentUser.email,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById('genMessage').textContent = '✅ Invoice saved successfully!';
            document.getElementById('genMessage').style.color = 'green';
            setTimeout(() => {
                closeModal('generateInvoiceModal');
                loadReceived(); // refresh list
            }, 1500);
        } catch (error) {
            document.getElementById('genMessage').textContent = '❌ ' + error.message;
            document.getElementById('genMessage').style.color = '#c0392b';
        } finally {
            btn.disabled = false;
            btn.textContent = '💾 Save Invoice';
        }
    }

    // ==================== Filter listeners ====================
    document.getElementById('invFilterBtn').addEventListener('click', loadInvoices);
    document.getElementById('retFilterBtn').addEventListener('click', loadReturns);
    document.getElementById('dispFilterBtn').addEventListener('click', loadDispatched);
    document.getElementById('recvFilterBtn').addEventListener('click', loadReceived);

    // ==================== Utility ====================
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    console.log('NEVAMAK Reports loaded with "Generate Invoice from Received" feature.');
</script>
