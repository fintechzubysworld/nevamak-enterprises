<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>User Management</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <style>
    :root{--accent:#2b7cff;--danger:#e05353;--muted:#666}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;line-height:1.4;margin:0;padding:24px;background:#f7f9fc;color:#111}
    .container{max-width:980px;margin:0 auto}
    /* ---- Header with back button ---- */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .page-header h1 {
      margin: 0;
      font-size: 1.8rem;
    }
    .back-btn {
      background: #0a3d62;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: #1e4f7a;
    }
    .card{background:#fff;border:1px solid #e6eef8;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 0 rgba(0,0,0,0.02)}
    form .row{display:flex;gap:12px;margin-bottom:8px}
    label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
    input,select{padding:8px;border:1px solid #d9e6f8;border-radius:6px;flex:1}
    button{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:6px;cursor:pointer}
    button.secondary{background:#fff;color:var(--accent);border:1px solid #cfe0ff}
    button.danger{background:var(--danger)}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{padding:10px;border-bottom:1px solid #eef6ff;text-align:left}
    th{background:#fbfdff;color:var(--muted);font-weight:600}
    .actions button{margin-right:6px}
    .muted{color:var(--muted);font-size:13px}
    .hidden{display:none}
    .message{padding:10px;border-radius:6px;margin-bottom:10px}
    .message.ok{background:#e9f7ff;color:#034a8f}
    .message.err{background:#ffecec;color:#5a1d1d}
    .badge{background:#e8edf2;padding:2px 10px;border-radius:20px;font-size:0.85rem;}
    @media(max-width:720px){.row{flex-direction:column}}
  </style>
</head>
<body>
  <div class="container">
    <!-- Header with back button -->
    <div class="page-header">
      <h1>👥 User Management</h1>
      <a href="index.html" class="back-btn">← Back to Dashboard</a>
    </div>

    <div id="msg" class="message hidden" aria-live="polite"></div>

    <section class="card" aria-labelledby="create-heading">
      <h2 id="create-heading">Create / Edit User</h2>
      <form id="user-form">
        <input type="hidden" id="user-id" />
        <div class="row">
          <div style="flex:2">
            <label for="name">Full name</label>
            <input id="name" name="name" placeholder="Jane Doe" required />
          </div>
          <div style="flex:3">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="jane@example.com" required />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="role">Role</label>
            <select id="role" name="role">
              <option value="user">User</option>
              <option value="admin">Admin</option>
              <option value="manager">Manager</option>
              <option value="lagos_sender">Lagos Sender</option>
              <option value="abuja_rep">Abuja Rep</option>
              <option value="ph_rep">PH Rep</option>
              <option value="vendor">Vendor</option>
            </select>
          </div>
          <div>
            <label for="password">Password (create only)</label>
            <input id="password" name="password" type="password" placeholder="••••••" />
            <small style="color:var(--muted);display:block;margin-top:4px;">Leave blank when editing</small>
          </div>
        </div>

        <div style="display:flex;gap:8px;margin-top:8px">
          <button id="save-btn">Save user</button>
          <button type="button" id="cancel-btn" class="secondary hidden">Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Existing users</h2>
      <div id="users-wrap">
        <p class="muted">Loading users...</p>
      </div>
    </section>
  </div>

  <script>
    // ===== Firebase Config =====
    const firebaseConfig = {
      apiKey: "AIzaSyBL_OZw3GmNHWjwBdGCc4F-5nUXEy5ZIcI",
      authDomain: "nevamak-enterprises.firebaseapp.com",
      projectId: "nevamak-enterprises",
      storageBucket: "nevamak-enterprises.firebasestorage.app",
      messagingSenderId: "144324172534",
      appId: "1:144324172534:web:4b6dd31754c79fd830aad7",
      measurementId: "G-MZ8NT6KK8N"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ===== Auth Guard (Admin only) =====
    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        const role = userDoc.data()?.role || '';
        if (role !== 'admin') {
          alert('⛔ Access denied. Admins only.');
          window.location.href = 'index.html';
          return;
        }
        // Load users
        fetchUsers();
      } catch (err) {
        console.error('Auth check failed:', err);
        showMessage('Authentication check failed. See console.', 'err');
      }
    });

    // ===== DOM References =====
    const msgEl = document.getElementById('msg');
    const usersWrap = document.getElementById('users-wrap');
    const form = document.getElementById('user-form');
    const userIdInput = document.getElementById('user-id');
    const cancelBtn = document.getElementById('cancel-btn');
    const saveBtn = document.getElementById('save-btn');

    // ===== Helpers =====
    function showMessage(text, type='ok'){
      msgEl.textContent = text;
      msgEl.className = `message ${type}`;
      msgEl.classList.remove('hidden');
      setTimeout(()=> msgEl.classList.add('hidden'), 4000);
    }

    function escapeHtml(str){
      if(!str) return '';
      return String(str).replace(/[&<>"']/g, function(s) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[s];
      });
    }

    // ===== Fetch users from Firestore =====
    async function fetchUsers(){
      usersWrap.innerHTML = '<p class="muted">Loading users...</p>';
      try {
        const snapshot = await db.collection('users').orderBy('createdAt', 'desc').get();
        if (snapshot.empty) {
          usersWrap.innerHTML = '<p class="muted">No users yet.</p>';
          return;
        }
        const users = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          users.push({
            id: doc.id,
            name: data.displayName || data.name || '—',
            email: data.email || '—',
            role: data.role || 'user',
            createdAt: data.createdAt ? data.createdAt.toDate() : null
          });
        });
        renderUsers(users);
      } catch (err) {
        console.error('Error fetching users:', err);
        usersWrap.innerHTML = `<p class="muted">Unable to fetch users: ${err.message}</p>`;
      }
    }

    // ===== Render users table =====
    function renderUsers(users){
      if(!users.length){
        usersWrap.innerHTML = '<p class="muted">No users yet.</p>';
        return;
      }
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>Name</th><th>Email</th><th>Role</th><th>Created</th><th>Actions</th></tr>';
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      users.forEach(u=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(u.name)}</td>
          <td>${escapeHtml(u.email)}</td>
          <td><span class="badge">${escapeHtml(u.role)}</span></td>
          <td>${u.createdAt ? u.createdAt.toLocaleString() : '—'}</td>
          <td class="actions">
            <button data-id="${u.id}" class="edit" style="background:var(--accent);color:#fff;border:0;padding:4px 12px;border-radius:4px;cursor:pointer;">Edit</button>
            <button data-id="${u.id}" class="delete" style="background:var(--danger);color:#fff;border:0;padding:4px 12px;border-radius:4px;cursor:pointer;">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      usersWrap.innerHTML = '';
      usersWrap.appendChild(table);
      attachRowHandlers();
    }

    function attachRowHandlers(){
      document.querySelectorAll('button.edit').forEach(b=>{
        b.addEventListener('click', async e=>{
          const id = e.currentTarget.dataset.id;
          await loadUserForEdit(id);
        });
      });
      document.querySelectorAll('button.delete').forEach(b=>{
        b.addEventListener('click', async e=>{
          const id = e.currentTarget.dataset.id;
          if(!confirm('⚠️ Delete this user permanently?')) return;
          await deleteUser(id);
        });
      });
    }

    // ===== Load user for editing =====
    async function loadUserForEdit(id){
      try {
        const doc = await db.collection('users').doc(id).get();
        if (!doc.exists) throw new Error('User not found');
        const data = doc.data();
        userIdInput.value = id;
        document.getElementById('name').value = data.displayName || data.name || '';
        document.getElementById('email').value = data.email || '';
        document.getElementById('role').value = data.role || 'user';
        document.getElementById('password').value = '';
        cancelBtn.classList.remove('hidden');
        saveBtn.textContent = 'Update user';
      } catch (err) {
        showMessage('Could not load user: '+err.message, 'err');
      }
    }

    // ===== Save (Create or Update) =====
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const id = userIdInput.value;
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value;

      if(!name || !email){
        showMessage('Name and email are required', 'err');
        return;
      }

      try {
        if (id) {
          // UPDATE existing user
          const updateData = {
            displayName: name,
            email: email,
            role: role,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          };
          await db.collection('users').doc(id).update(updateData);
          showMessage('✅ User updated successfully', 'ok');
        } else {
          // CREATE new user with email/password
          if (!password || password.length < 6) {
            showMessage('Password must be at least 6 characters for new users.', 'err');
            return;
          }
          // Create auth user
          const userCred = await auth.createUserWithEmailAndPassword(email, password);
          const uid = userCred.user.uid;
          // Create Firestore document
          await db.collection('users').doc(uid).set({
            displayName: name,
            email: email,
            role: role,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            createdBy: auth.currentUser?.uid || 'system'
          });
          showMessage('✅ User created successfully', 'ok');
        }
        // Reset form
        form.reset();
        userIdInput.value = '';
        cancelBtn.classList.add('hidden');
        saveBtn.textContent = 'Save user';
        // Reload list
        await fetchUsers();
      } catch (err) {
        console.error('Save error:', err);
        showMessage('❌ Error: ' + err.message, 'err');
      }
    });

    // ===== Cancel edit =====
    cancelBtn.addEventListener('click', ()=>{
      form.reset();
      userIdInput.value = '';
      cancelBtn.classList.add('hidden');
      saveBtn.textContent = 'Save user';
    });

    // ===== Delete user =====
    async function deleteUser(id){
      try {
        // Delete from Firestore
        await db.collection('users').doc(id).delete();
        // Optionally delete auth user (requires admin SDK, skip for now)
        showMessage('🗑️ User deleted from Firestore.', 'ok');
        await fetchUsers();
      } catch (err) {
        showMessage('❌ Delete error: ' + err.message, 'err');
      }
    }
  </script>
</body>
</html>
